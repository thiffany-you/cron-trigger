name: Daily Trigger for ai-news-digest

on:
  schedule:
    - cron: "0 0 * * *"  # UTC midnight = Beijing 08:00
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.GH_PAT }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/thiffany-you/ai-news-digest/actions/workflows/ai-news.yml/dispatches" \
            -d '{"ref":"main"}' \
            -w "\n%{http_code}"
